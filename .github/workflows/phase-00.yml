name: Penforge foundations and identity
# PR branches run once through pull_request; merged/default-branch changes run on push.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_DB: penforge_test
          POSTGRES_USER: penforge
          POSTGRES_PASSWORD: penforge
        ports: ["5432:5432"]
        # The runner parses these arguments directly, without shell quoting.
        options: >-
          --health-cmd "pg_isready -U penforge -d penforge_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      PYTHONPATH: apps/api:packages/contracts:packages/font-engine:.
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://penforge:penforge@127.0.0.1:5432/penforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - run: make setup
      - run: make check
      - name: Firebase Auth emulator and PostgreSQL acceptance
        env:
          PENFORGE_TEST_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: npx --yes --package firebase-tools@15.34.0 firebase emulators:exec --only auth --project demo-penforge-identity --config infrastructure/firebase/firebase.json "make test-identity-emulator"
      # phase-11's image-budget job owns both image builds and runtime/security acceptance.
