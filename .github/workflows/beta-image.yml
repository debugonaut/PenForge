name: Penforge beta API image
# Builds the single API+worker container and publishes it to the GitHub Container
# Registry, so a hosting provider only needs pull access to an image. No third
# party is granted write access to this repository.
on:
  push:
    branches: [release/private-beta]
    paths:
      - ".github/workflows/beta-image.yml"
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "scripts/**"
      - "infrastructure/migrations/**"
      - "infrastructure/deployment/beta/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/penforge-beta
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/deployment/beta/beta.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
