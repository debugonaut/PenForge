services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: penforge
      POSTGRES_USER: penforge
      POSTGRES_PASSWORD: penforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penforge -d penforge"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  postgres_data:
